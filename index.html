  return { titulo:pl.nome, setorTxt:`Setor ${setor(r)} · ${r.nome}`, reg:r, html, cor:pl.cor };
}
function rodapeHTML(){ return `<footer class="rodape">
  <p><b><span translate="no">BRAUFONET</span> – Rede Brasileira de Ufologia</b> · CNPJ 68.162.826/0001-90 · Recife/PE</p>
  <nav aria-label="Informações legais e contato"><a href="#/info/privacidade">Privacidade</a><a href="#/info/termos">Termos de uso</a><a href="#/info/transparencia">Transparência</a><a href="https://wa.me/5581994473390" target="_blank" rel="noopener">WhatsApp</a><a href="mailto:braufonet@gmail.com">E-mail</a><a href="https://www.youtube.com/@BRAUFONET" target="_blank" rel="noopener">YouTube</a><a href="https://www.instagram.com/braufonet/" target="_blank" rel="noopener">Instagram</a></nav>
</footer>`; }
function montarPagina(chave){
  const d = dadosPagina(chave); if (!d) return false;
  const migalha = d.reg ? `<a href="#/">Início</a> › <a href="#/${d.reg.id}">${d.reg.nome}</a> › ${d.titulo}` : `<a href="#/">Início</a> › ${d.titulo}`;
  pg.className = 'pg p-' + d.cor + (pg.classList.contains('aberta') ? ' aberta' : '');
  pg.innerHTML = `<header class="pg__topo"><button class="voltar" type="button" id="pgVoltar"><svg class="ic" aria-hidden="true" style="vertical-align:-.25em"><use href="#i-voltar"/></svg> Voltar ao universo</button><nav class="migalha" aria-label="Você está em">${migalha}</nav></header>
    <div class="pg__horizonte" aria-hidden="true"></div>
    <article class="pg__conteudo"><p class="pg__setor">${d.setorTxt}</p><h1 id="pgTitulo" tabindex="-1">${d.titulo}</h1>${d.html}${rodapeHTML()}</article>`;
  pg.querySelectorAll('.linha-tempo li, .grade-itens li').forEach((li,i)=>li.style.setProperty('--i', i));
  $('#pgVoltar').onclick = fecharPaginaPeloUsuario;
  document.title = `${d.titulo} · ${d.reg ? d.reg.titulo : 'Informações'} — BRAUFONET`;
  return true;
}
function mostrarPg(){
  pg.classList.add('aberta','entrando'); pg.setAttribute('aria-hidden','false'); pg.scrollTop = 0; ultimoScroll = 0;
  setTimeout(()=>pg.classList.remove('entrando'), 1400);
  viewport.inert = true; mapa.inert = true; $('.hud').style.visibility = 'hidden'; document.body.classList.add('pg-aberta');
  $('#pgTitulo').focus({preventScroll:true});
  $('#aviso').textContent = 'Página aberta: ' + $('#pgTitulo').textContent;
}
function ocultarPg(){
  pg.classList.remove('aberta'); pg.setAttribute('aria-hidden','true'); document.body.classList.remove('menu-recolhido');
  viewport.inert = false; mapa.inert = false; $('.hud').style.visibility = ''; document.body.classList.remove('pg-aberta');
  document.title = tituloOriginal;
}
let ultimoScroll = 0;
pg.addEventListener('scroll', ()=>{                                   // no celular, o Menu recolhe ao descer e volta ao subir
  const y = pg.scrollTop;
  if (y > ultimoScroll + 8 && y > 120) document.body.classList.add('menu-recolhido');
  else if (y < ultimoScroll - 8) document.body.classList.remove('menu-recolhido');
  ultimoScroll = y;
}, {passive:true});
function fecharPaginaPeloUsuario(){
  if (paginaPush) { paginaPush = false; history.back(); }
  else { const a = paginaAberta || ''; location.hash = a.startsWith('info/') ? '#/' + (atual==='inicio'?'':atual) : '#/' + a.split('/')[0]; }
}
world.addEventListener('click', e=>{
  const p = e.target.closest('.planeta'); if (!p || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault(); paginaPush = true; location.hash = '#/' + p.dataset.pag;
});
function corDoPlaneta(el){ return [...el.classList].find(c=>c.startsWith('p-')); }
function clonePlaneta(cor, r){
  const c = document.createElement('div'); c.className = 'zoom-planeta ' + cor;
  Object.assign(c.style, {left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px'});
  document.body.appendChild(c); return c;
}
/* Entrar: a câmera aproxima um pouco (o fundo) e o planeta cresce muito mais — profundidade */
function zoomEntrar(chave, pronto){
  const pl = document.querySelector(`.planeta[data-pag="${chave}"]`);
  const esf = pl && pl.querySelector('.planeta__esfera'), r = esf && esf.getBoundingClientRect();
  if (!r || !r.width || movReduzido() || efeitosReduzidos()) { pronto(); return; }
  const cx = r.left + r.width/2, cy = r.top + r.height/2, k = Math.hypot(W,H)*1.06 / r.width;
  const clone = clonePlaneta(corDoPlaneta(pl), r); esf.style.visibility = 'hidden';
  voar(cam.x + (cx-W/2)/cam.s, cam.y + (cy-H/2)/cam.s, 1.8, DUR_ZOOM, 0, null, {semParallax:true});
  clone.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${W/2-cx}px,${H/2-cy}px) scale(${k})`}],
    {duration:DUR_ZOOM, easing:cssCurva(), fill:'forwards'}).onfinish = () => {
      pronto(); setTimeout(()=>{ clone.remove(); esf.style.visibility = ''; }, 320);
    };
}
/* Sair: a página some revelando o planeta gigante, que encolhe de volta ao lugar */
function zoomSair(chave){
  const pl = document.querySelector(`.planeta[data-pag="${chave}"]`), reg = regiao(chave.split('/')[0]), c = centro(reg);
  const esf = pl && pl.querySelector('.planeta__esfera'), r = esf && esf.getBoundingClientRect();
  if (!r || !r.width || movReduzido() || efeitosReduzidos()) { ocultarPg(); voar(c.x,c.y,1,0,0); pl && pl.focus({preventScroll:true}); return; }
  const wx = cam.x + (r.left + r.width/2 - W/2)/cam.s, wy = cam.y + (r.top + r.height/2 - H/2)/cam.s;
  const size = r.width / cam.s, sx = W/2 + (wx - c.x), sy = H/2 + (wy - c.y);
  const box = {left:sx-size/2, top:sy-size/2, width:size, height:size}, k = Math.hypot(W,H)*1.06 / size;
  const clone = clonePlaneta(corDoPlaneta(pl), box); esf.style.visibility = 'hidden';
  clone.style.transform = `translate(${W/2-sx}px,${H/2-sy}px) scale(${k})`;
  ocultarPg();
  voar(c.x, c.y, 1, DUR_ZOOM, 0, null, {semParallax:true});
  clone.animate([{transform:`translate(${W/2-sx}px,${H/2-sy}px) scale(${k})`},{transform:'translate(0,0) scale(1)'}],
    {duration:DUR_ZOOM, easing:cssCurva(), fill:'forwards'}).onfinish = () => { clone.remove(); esf.style.visibility = ''; pl.focus({preventScroll:true}); };
}

/* ==========================================================================
   TECLADO E TOQUE
   ========================================================================== */
addEventListener('keydown', e=>{
  if (e.key==='Escape') { if (menuAberto) fecharMenu(); else if (paginaAberta) fecharPaginaPeloUsuario(); else if (mapaAberto) fechaMapa(true); return; }
  if (menuAberto && e.key==='Tab') {                                   // foco preso no menu aberto
    const f = [...menuLista.querySelectorAll('.menu-item'), menuBtn], i = f.indexOf(document.activeElement);
    e.preventDefault(); f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus(); return;
  }
  if (paginaAberta || menuAberto || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key==='m' || e.key==='M') { toggleMapa(); return; }
  const d = {ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(!d || mapaAberto) return;
  const r = regiao(atual), v = REGIOES.find(x=>x.col===r.col+d[0] && x.row===r.row+d[1]);
  if (v) { e.preventDefault(); navegar(v.id, {rapido:true}); }
});
/* Toque: o universo acompanha o dedo; ao soltar decide pela distância ou pela velocidade */
let arrasto = null, fimArrasto = 0;
viewport.addEventListener('pointerdown', e=>{
  if (e.pointerType!=='touch' || paginaAberta || mapaAberto || menuAberto || voo) return;
  const t = performance.now();
  arrasto = {id:e.pointerId, x0:e.clientX, y0:e.clientY, cx:cam.x, cy:cam.y, ativo:false, lx:e.clientX, ly:e.clientY, lt:t, vx:0, vy:0};
});
viewport.addEventListener('pointermove', e=>{
  if (!arrasto || e.pointerId!==arrasto.id) return;
  const dx = e.clientX-arrasto.x0, dy = e.clientY-arrasto.y0;
  if (!arrasto.ativo) { if (Math.hypot(dx,dy) < 10) return; arrasto.ativo = true; try { viewport.setPointerCapture(e.pointerId); } catch(_){} }
  const t = performance.now(), dt = Math.max(1, t-arrasto.lt);
  arrasto.vx = (e.clientX-arrasto.lx)/dt; arrasto.vy = (e.clientY-arrasto.ly)/dt; arrasto.lx=e.clientX; arrasto.ly=e.clientY; arrasto.lt=t;
  const lim = (v, a, b) => Math.min(Math.max(v, a), b);                      // no máximo um setor de distância
  aplicar(lim(arrasto.cx-dx, arrasto.cx-W, arrasto.cx+W), lim(arrasto.cy-dy, arrasto.cy-H, arrasto.cy+H), 1);
});
function soltar(e){
  if (!arrasto || e.pointerId!==arrasto.id) return;
  const a = arrasto; arrasto = null; if (!a.ativo) return;
  fimArrasto = performance.now();
  const dx = a.lx-a.x0, dy = a.ly-a.y0, r = regiao(atual);
  const dir = (d, v, tam) => (d < -tam*0.22 || (v < -0.45 && d < -24)) ? 1 : (d > tam*0.22 || (v > 0.45 && d > 24)) ? -1 : 0;
  let c = dir(dx, a.vx, W), l = dir(dy, a.vy, H);
  if (Math.abs(dx) > Math.abs(dy)*1.8) l = 0; if (Math.abs(dy) > Math.abs(dx)*1.8) c = 0;
  const v = (c||l) && REGIOES.find(x=>x.col===r.col+c && x.row===r.row+l);
  if (v) navegar(v.id);
  else { const k = centro(r); voar(k.x, k.y, 1, movReduzido()?0:320, 0); }   // volta ao lugar
}
viewport.addEventListener('pointerup', soltar);
viewport.addEventListener('pointercancel', soltar);
world.addEventListener('click', e=>{ if (performance.now()-fimArrasto < 80) { e.preventDefault(); e.stopPropagation(); } }, true);   // arrasto não vira clique

/* ==========================================================================
   LOGO: montagem + parallax (o céu é o próprio fundo do universo)
   ========================================================================== */
const camadas = [...document.querySelectorAll('#logo .camada')];
let px=0, py=0, tx=0, ty=0, parallaxRaf=0, montada=false;
addEventListener('pointermove', e=>{ if (e.pointerType==='touch') return; tx=(e.clientX/W-.5)*2; ty=(e.clientY/H-.5)*2; });
function iniciaParallax(){
  if (efeitosReduzidos() || parallaxRaf || !montada) return;
  const loop = now => {
    px += (tx-px)*0.06; py += (ty-py)*0.06;
    const bob = Math.sin(now/1600);
    camadas.forEach(c=>{ const k=+c.dataset.prof; c.style.transform = `translate3d(${px*k}px, ${py*k + (k>20?bob*5:0)}px, 0)`; });
    parallaxRaf = atual==='inicio' ? requestAnimationFrame(loop) : 0;
  };
  parallaxRaf = requestAnimationFrame(loop);
}
function montarLogo(){
  const [aro, brasil, disco] = camadas.map(c=>c.firstElementChild);
  const logo = $('#logo'); montada = false;
  entradaPainel();
  if (movReduzido()) { logo.classList.remove('pre'); montada = true; return; }
  if (efeitosReduzidos()) { logo.classList.remove('pre'); logo.animate([{opacity:0},{opacity:1}],{duration:600,easing:'ease-out'}); montada = true; return; }
  const o = {fill:'backwards'};
  aro.animate([{opacity:0,transform:'scale(.9)',filter:'blur(6px)'},{opacity:1,transform:'none',filter:'blur(0)'}],{...o,duration:1100,easing:'cubic-bezier(.16,1,.3,1)'});
  brasil.animate([{opacity:0,transform:'translateY(9%)'},{opacity:1,transform:'none'}],{...o,duration:1200,delay:450,easing:'cubic-bezier(.16,1,.3,1)'});
  disco.animate([{opacity:0,transform:'translate(70%,-95%) scale(.35) rotate(-12deg)'},{opacity:1,transform:'translate(14%,-18%) scale(.8) rotate(-4deg)',offset:.55},{opacity:1,transform:'none'}],
    {...o,duration:cfg.dur*1000*1.35,delay:900,easing:cssCurva()}).onfinish = ()=>{ montada = true; if (atual==='inicio') iniciaParallax(); };
  logo.classList.remove('pre');
}

/* ==========================================================================
   APLICA OS AJUSTES (valores de PADRAO, ou os que o index_aux.html enviar)
   ========================================================================== */
let textoAplicado = null;
function aplicaCfg(){
  $('#painel').className = 'painel fam-' + cfg.familia;
  const B=document.body.style;
  B.setProperty('--nucleo', (cfg.nucleo*100)+'%');
  if (window.posicionarSombras) posicionarSombras();
  document.body.dataset.legenda = cfg.legenda;
  document.documentElement.style.setProperty('--escala-texto', cfg.texto);
  B.setProperty('--b', cfg.escuro); B.setProperty('--c', cfg.estrelas); B.setProperty('--t', cfg.tunel);
  if (innerWidth>760) B.setProperty('--m', `clamp(0px,${cfg.moldura}vmin,80px)`); else B.removeProperty('--m');
  B.setProperty('--td', cfg.tempo+'s'); B.setProperty('--linha', LINHAS[cfg.linha] || LINHAS.ouro);
  const h=$('#r-inicio'); if (atual==='inicio' && h && h.classList.contains('is-active')) { h.classList.toggle('esmaecida', cfg.dimCentro); if (window.syncSombras) syncSombras(); }
  if (textoAplicado!==null && textoAplicado!==cfg.texto) { medir(); const c=centro(regiao(atual)); aplicar(c.x,c.y,1); }
  textoAplicado = cfg.texto;
}
addEventListener('resize', ()=>aplicaCfg());
aplicaCfg();

/* Ponte com o index_aux.html: só funciona quando este arquivo está aberto DENTRO dele.
   Aberto direto (o site de verdade), nada aqui é usado; apagar o index_aux não afeta o site. */
const EMBUTIDO = window.parent !== window;
function avisaAux(m){ if (EMBUTIDO) { try { parent.postMessage(m, '*'); } catch(e){} } }
if (EMBUTIDO) addEventListener('message', e=>{
  if (e.source !== window.parent) return;
  const d = e.data; if (!d || typeof d !== 'object') return;
  if (d.tipo==='bn-ajustes' && d.cfg && typeof d.cfg==='object') {
    for (const k in PADRAO) if (k in d.cfg && typeof d.cfg[k]===typeof PADRAO[k]) cfg[k] = d.cfg[k];
    aplicaCfg();
  } else if (d.tipo==='bn-nave') {
    if (window.NAVE) NAVE.agora(d.modo);
  } else if (d.tipo==='bn-logo') {
    if (atual!=='inicio') navegar('inicio'); setTimeout(montarLogo, atual==='inicio'?0:cfg.dur*1300);
  }
});
avisaAux({tipo:'bn-pronto', padrao:PADRAO, familias:FAMILIAS});

/* ==========================================================================
   REDUZIR EFEITOS (preferência do visitante, salva para as próximas visitas)
   ========================================================================== */
/* Botão "Fundo em movimento": acende (luz azul no ícone vazado) quando o parallax está ligado.
   A escolha fica salva no navegador. Sem escolha, o site decide sozinho (aparelho, conexão, sistema). */
const plxBtn = $('#plxBtn');
function atualizaPlxBtn(){
  const on = !efeitosReduzidos();
  plxBtn.setAttribute('aria-pressed', String(on));
  plxBtn.dataset.dica = on ? 'Efeitos ligados' : 'Efeitos desligados';
  document.body.classList.toggle('efeitos-off', !on);
}
plxBtn.onclick = () => {
  const ligar = efeitosReduzidos();
  try { localStorage.setItem('bn-efeitos-pesados', ligar ? 'on' : 'off'); if (ligar) sessionStorage.removeItem('bn-plx-off'); } catch(e){}
  if (ligar) { PLX.avaliar(); if (atual==='inicio') iniciaParallax(); }
  else { PLX.desligar('Escolha do visitante: efeitos desligados', false); cancelAnimationFrame(parallaxRaf); parallaxRaf = 0; camadas.forEach(c=>c.style.transform=''); }
  atualizaPlxBtn();
  $('#aviso').textContent = plxBtn.dataset.dica;
};
function aplicaMovimento(){ const r = movReduzido(); document.documentElement.classList.toggle('mov-reduzido', r); document.body.classList.toggle('sem-flutuar', r); }
reduz.addEventListener && reduz.addEventListener('change', ()=>{ aplicaMovimento(); PLX.avaliar(); });

/* Entrada do painel no Hero: o console sobe e os botões aparecem um a um */
function entradaPainel(){
  document.body.classList.remove('pre-painel');
  if (movReduzido() || atual!=='inicio') return;
  const ease = 'cubic-bezier(.23,1,.32,1)', o = {fill:'backwards'};
  const rack = $('.rack'), btns = [...commands.children];
  if (getComputedStyle($('#painel')).display !== 'none') {
    rack.animate([{transform:'translateY(110%)',opacity:0},{transform:'none',opacity:1}],{...o,duration:650,delay:900,easing:ease});
    btns.forEach((b,i)=>b.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{...o,duration:420,delay:1150+i*60,easing:ease}));
  } else {
    menuBtn.animate([{transform:'translate(-50%,160%)',opacity:0},{transform:'translate(-50%,0)',opacity:1}],{...o,duration:650,delay:1000,easing:ease});
  }
}

/* ==========================================================================
   FUNDO EM CAMADAS — parallax adaptativo
   Começa sempre no estático (soma das camadas). Só liga com sinais favoráveis +
   teste curto de desempenho. Monitora os voos e volta ao estático se cair.
   ========================================================================== */
const PLX = (()=>{
  const CAM = ['fundo','nebulosa','estrelas'];
  const K = { fundo:.10, nebulosa:.06, estrelas:.03 };          // quanto cada camada "fica para trás" no voo
  const DRIFT = { fundo:3, nebulosa:7, estrelas:12 };           // deslocamento com o mouse, parado (px)
  const q = new URLSearchParams(location.search), forca = q.get('fundo'), lento = q.get('lento')==='1';
  let modo='estatico', motivo='aguardando o fim da intro', estado=Array(9).fill('nada'), res=960;
  let vooOff={x:0,y:0}, drift={x:0,y:0}, alvo={x:0,y:0}, raf=0, ult=0, frames=[], ruins=0;
  const rect={x:0,y:0,w:0,h:0};
  const box = document.createElement('div'); box.className='planos'; box.setAttribute('aria-hidden','true');
  const planos = CAM.map(k=>{
    const p = document.createElement('div'); p.className='plano plano--'+k;
    for (let i=0;i<9;i++){ const im=document.createElement('img'); im.className='tile'; im.alt=''; im.decoding='async';
      im.style.left=(i%3)*33.3333+'%'; im.style.top=Math.floor(i/3)*33.3333+'%'; p.appendChild(im); }
    box.appendChild(p); return p;
  });
  world.prepend(box);
  const ativo = () => modo==='parallax';
  function status(){ console.info('[fundo]', modo, '—', motivo); if (window.atualizaPlxBtn) atualizaPlxBtn(); avisaAux({tipo:'bn-status', ativo:ativo(), texto:motivo}); }
  function layout(){                                            // mesmo enquadramento do "center/cover" do fundo estático
    const sc = Math.max(3*W/5760, 3*H/3240); rect.w=5760*sc; rect.h=3240*sc; rect.x=(3*W-rect.w)/2; rect.y=(3*H-rect.h)/2;
    Object.assign(box.style,{left:rect.x+'px',top:rect.y+'px',width:rect.w+'px',height:rect.h+'px'}); aplicarPlanos();
  }
  function carregar(i){
    if (estado[i]!=='nada' || !ativo()) return Promise.resolve();
    estado[i]='carregando';
    const imgs = planos.map(p=>p.children[i]), n = String(i+1).padStart(2,'0');
    imgs.forEach((im,j)=>{ im.src = `assets/camadas/${res}/${n}-${CAM[j]}.webp`; });
    return Promise.all(imgs.map(im=>im.decode())).then(()=>{
      if (!ativo()) return; estado[i]='pronto'; imgs.forEach(im=>im.classList.add('pronto'));   // igual ao estático: troca invisível
    }).catch(()=>{ estado[i]='erro'; });
  }
  function preCarregar(){                                        // setor atual primeiro; vizinhos diretos quando o navegador estiver ocioso
    if (!ativo()) return;
    const r = regiao(atual), l = [r.row*3+r.col];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dc,dr])=>{ const c=r.col+dc, rr=r.row+dr; if (c>=0&&c<3&&rr>=0&&rr<3) l.push(rr*3+c); });
    const ocioso = window.requestIdleCallback || (f=>setTimeout(f,400));
    // depois: os demais quadros, do mais próximo ao mais distante, só quando o navegador estiver ocioso
    const resto = [0,1,2,3,4,5,6,7,8].filter(i=>!l.includes(i)).sort((a,b)=>Math.hypot(a%3-r.col, (a/3|0)-r.row) - Math.hypot(b%3-r.col, (b/3|0)-r.row));
    carregar(l[0]).then(()=>Promise.all(l.slice(1).map(i=>new Promise(ok=>ocioso(()=>carregar(i).then(ok))))))
      .then(()=>resto.forEach(i=>ocioso(()=>carregar(i), {timeout:4000})));
  }
  function caminhoPronto(de, para, sMin){                         // todos os quadros que vão aparecer no voo já carregaram?
    const hw=W/(2*sMin), hh=H/(2*sMin), tw=rect.w/3, th=rect.h/3;
    const x0=Math.min(de.x,para.x)-hw, x1=Math.max(de.x,para.x)+hw, y0=Math.min(de.y,para.y)-hh, y1=Math.max(de.y,para.y)+hh, l=[];
    for (let r=0;r<3;r++) for (let c=0;c<3;c++){ const tx=rect.x+c*tw, ty=rect.y+r*th; if (tx<x1 && tx+tw>x0 && ty<y1 && ty+th>y0) l.push(r*3+c); }
    l.forEach(i=>carregar(i));
    return l.every(i=>estado[i]==='pronto');                      // se não, este voo acontece sem parallax (sem emendas)
  }
  function aplicarPlanos(){
    const s=cam.s, hw=W/(2*s), hh=H/(2*s);
    planos.forEach((p,j)=>{ const k=CAM[j];
      let ox = vooOff.x*K[k] + drift.x*DRIFT[k], oy = vooOff.y*K[k] + drift.y*DRIFT[k];
      ox = Math.min(Math.max(ox, cam.x+hw-(rect.x+rect.w)), cam.x-hw-rect.x);   // nunca revela a borda da imagem
      oy = Math.min(Math.max(oy, cam.y+hh-(rect.y+rect.h)), cam.y-hh-rect.y);
      p.style.transform = `translate3d(${ox.toFixed(1)}px,${oy.toFixed(1)}px,0)`;
    });
  }
  const residuo = () => ({x:vooOff.x, y:vooOff.y});
  function voo(t, D, r0, e){
    if (!ativo()) return;
    const a = Math.sin(Math.PI*t);
    vooOff.x = (r0 ? r0.x*(1-e) : 0) + (D ? D.x*a : 0);
    vooOff.y = (r0 ? r0.y*(1-e) : 0) + (D ? D.y*a : 0);
    aplicarPlanos();
  }
  function quadro(dt){
    if (!ativo() || document.hidden) return;
    if (lento) { const t=performance.now(); while (performance.now()-t < 40) {} }   // ?lento=1 simula aparelho fraco
    frames.push(dt);
  }
  function fimDeAnimacao(){
    if (!ativo()) { frames=[]; return; }
    const f = frames.slice(2); frames = [];
    if (f.length < 15) return;
    const ruim = f.filter(d=>d>34).length / f.length;
    if (ruim > 0.25) { if (++ruins >= 2) desligar(`Queda sustentada de desempenho (${Math.round(ruim*100)}% dos quadros abaixo de 30 fps em ${ruins} animações seguidas)`, true); }
    else ruins = 0;
  }
  function loopDrift(now){
    if (ult) quadro(now-ult); ult = now;
    drift.x += (alvo.x-drift.x)*0.06; drift.y += (alvo.y-drift.y)*0.06;
    if (!voo) aplicarPlanos();
    if (ativo() && Math.abs(alvo.x-drift.x)+Math.abs(alvo.y-drift.y) > 0.002) raf = requestAnimationFrame(loopDrift);
    else { raf = 0; ult = 0; fimDeAnimacao(); }
  }
  addEventListener('pointermove', e=>{
    if (e.pointerType!=='mouse' || !ativo() || efeitosReduzidos() || document.hidden) return;
    alvo.x = -(e.clientX/W-.5)*2; alvo.y = -(e.clientY/H-.5)*2;
    if (!raf) raf = requestAnimationFrame(loopDrift);
  });
  document.addEventListener('visibilitychange', ()=>{ if (document.hidden) { cancelAnimationFrame(raf); raf=0; ult=0; frames=[]; } });
  function sinais(){
    if (prefParallax()==='off') return {ok:false, msg:'Escolha do visitante: efeitos desligados'};
    if (reduz.matches) return {ok:false, msg:'O sistema pede movimento reduzido'};
    if (matchMedia('(prefers-reduced-data: reduce)').matches) return {ok:false, msg:'O sistema pede economia de dados'};
    const c = navigator.connection;
    if (c) {
      if (c.saveData) return {ok:false, msg:'Economia de dados ativada'};
      if (/^(slow-2g|2g|3g)$/.test(c.effectiveType||'')) return {ok:false, msg:`Conexão lenta (${c.effectiveType})`};
      if (c.downlink && c.downlink < 1.5) return {ok:false, msg:`Conexão lenta (${c.downlink} Mb/s)`};
    }
    if (navigator.deviceMemory && navigator.deviceMemory < 4) return {ok:false, leve:true, msg:`Pouca memória (${navigator.deviceMemory} GB)`};
    if (navigator.hardwareConcurrency && navigator.hardwareConcurrency < 4) return {ok:false, leve:true, msg:`Processador com ${navigator.hardwareConcurrency} núcleos`};
    const parcial = !c || !navigator.deviceMemory;
    return {ok:true, parcial, msg: parcial ? 'O navegador não informa rede/memória (decisão conservadora pelo teste)' : `Sinais favoráveis (${c.effectiveType}, ${navigator.deviceMemory} GB)`};
  }
  function teste(limite, cb){                                     // ~50 quadros; mede o percentil 90 do tempo entre quadros
    const d=[]; let u=0, n=0;
    const f = now => { if (u) { if (lento) { const t=performance.now(); while (performance.now()-t < 40) {} } d.push(now-u); } u=now;
      if (++n < 50) requestAnimationFrame(f); else { d.sort((a,b)=>a-b); const p90=Math.round(d[Math.floor(d.length*.9)]); cb(p90<=limite, p90); } };
    requestAnimationFrame(f);
  }
  function ligar(msg){
    modo='parallax'; motivo=msg; ruins=0;
    const celular = matchMedia('(pointer:coarse)').matches && Math.min(W,H) < 600;
    res = (!celular && W*(devicePixelRatio||1) > 1000) ? 1920 : 960;
    vooOff={x:0,y:0}; drift={x:0,y:0}; aplicarPlanos();              // alinha com a câmera atual antes de aparecer
    document.body.classList.add('parallax-on'); status(); preCarregar();
    const c = navigator.connection;
    if (c && c.addEventListener) c.addEventListener('change', ()=>{ if (ativo() && (c.saveData || /^(slow-2g|2g|3g)$/.test(c.effectiveType||''))) desligar('A conexão ficou lenta ou a economia de dados foi ativada', true); });
  }
  function desligar(msg, porDesempenho){
    if (porDesempenho) { try { sessionStorage.setItem('bn-plx-off', msg); } catch(e){} document.body.classList.add('leve'); }   // não volta a ligar nesta visita
    const eraAtivo = ativo(); modo='estatico'; motivo=msg; status();
    if (!eraAtivo) return;
    const fim = () => {
      const t0=performance.now(), d0={x:drift.x,y:drift.y}, v0={x:vooOff.x,y:vooOff.y};
      const anim = now => { const k=Math.min(1,(now-t0)/350);            // camadas voltam ao alinhamento exato antes de sumir
        drift.x=d0.x*(1-k); drift.y=d0.y*(1-k); vooOff.x=v0.x*(1-k); vooOff.y=v0.y*(1-k); aplicarPlanos();
        if (k<1) requestAnimationFrame(anim);
        else { document.body.classList.remove('parallax-on');
          setTimeout(()=>{ if (!ativo()) { planos.forEach(p=>{ p.style.transform=''; [...p.children].forEach(im=>{ im.classList.remove('pronto'); im.removeAttribute('src'); }); }); estado=Array(9).fill('nada'); } }, 600); } };
      requestAnimationFrame(anim);
    };
    const esperar = () => voo ? requestAnimationFrame(esperar) : fim();   // nunca no meio de um voo
    esperar();
  }
  function avaliar(){
    if (forca==='estatico') { motivo='Forçado por ?fundo=estatico'; modo='estatico'; status(); return; }
    if (forca==='parallax') { ligar('Forçado por ?fundo=parallax (o monitor de desempenho continua ativo)'); return; }
    if (prefParallax()==='on' && !sessionStorage.getItem('bn-plx-off')) { ligar('Escolha do visitante: efeitos ligados (o monitor de desempenho continua ativo)'); return; }
    if (prefParallax()==='off') { motivo='Escolha do visitante: efeitos desligados'; status(); return; }
    let off=null; try { off=sessionStorage.getItem('bn-plx-off'); } catch(e){}
    if (off) { motivo = off + ' — mantido estático nesta visita'; document.body.classList.add('leve'); status(); return; }
    const s = sinais(); if (!s.ok) { motivo=s.msg; if (s.leve) document.body.classList.add('leve'); status(); return; }
    motivo = s.msg + ' · testando desempenho…'; status();
    teste(s.parcial ? 18 : 24, (ok,p90)=>{
      if (ok) ligar(`${s.msg} · teste OK (90% dos quadros em até ${p90} ms)`);
      else { motivo = `${s.msg} · teste reprovado (${p90} ms por quadro)`; document.body.classList.add('leve'); status(); }
    });
  }
  return { layout, ativo, voo, residuo, quadro, fimDeAnimacao, caminhoPronto, preCarregar, avaliar, desligar, status };
})();
window.PLX = PLX;


/* ==========================================================================
   NAVE — o disco da logo cruza o céu de vez em quando
   · Passagem: atravessa a tela em 0,4–0,9s com cauda de estrela cadente.
   · Visita: chega rápido a um ponto livre, flutua e depois sai (pela borda,
     afundando no espaço ou vindo em direção à tela).
   · No Hero quem sai é o próprio disco da logo (primeira vez após 60s no Hero).
   · Só com o fundo da galáxia à vista; nunca nas páginas, na intro, durante um
     voo, com a aba escondida ou com os efeitos desligados.
   ========================================================================== */
const NAVE = (()=>{
  const rapido = new URLSearchParams(location.search).get('nave')==='rapido';   // teste: intervalos 10× menores
  const CROP = {x:.25374, y:.21797, w:.48003, h:.22463};                         // onde está o disco dentro da imagem da camada
  const ASP = 270/577;
  const camada = document.createElement('div'); camada.className = 'naves'; camada.setAttribute('aria-hidden','true');
  sombrasEl.after(camada);
  const el = document.createElement('div'); el.className = 'nave';
  el.innerHTML = '<div class="nave__cauda"></div><div class="nave__corpo"><div class="nave__balanco"><div class="nave__brilho"></div><img alt="" draggable="false"></div></div>';
  camada.appendChild(el);
  const img = el.querySelector('img'), cauda = el.querySelector('.nave__cauda'), corpo = el.querySelector('.nave__corpo');
  const disco = camadas[2];
  let estado = 'espera', evento = null, acum = 0, alvo = 0, heroAcum = 0, heroLiberado = false, tAnt = performance.now();
  let flutuaRest = 0, fimFlutuar = null, base = 40, anims = [], fuga = null;
  alvo = sortear();

  function sortear(){                                            // 5–50s, concentrado em torno de 30s (≈80% entre 20 e 40s)
    const a = cfg.naveMin, b = Math.max(cfg.naveMax, a+1), m = Math.min(Math.max(cfg.naveMedia, a), b), sd = (b-a)/5.6; let v, n=0;
    do { const u = 1-Math.random(), w = Math.random(); v = m + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*w); } while ((v<a || v>b) && ++n<50);
    v = Math.min(b, Math.max(a, v)); return rapido ? v/10 : v;
  }
  const rnd = (a,b) => a + Math.random()*(b-a);
  const lado = () => Math.max(W,H);
  const tamanho = () => Math.max(12, lado()*rnd(cfg.naveTamMin, cfg.naveTamMax)/100);   // % do lado maior da tela
  const mundo = (sx,sy) => ({x: cam.x + (sx - W/2)/cam.s, y: cam.y + (sy - H/2)/cam.s});
  function kf(x, y, k, op=1, extra={}){ const p = mundo(x,y), w = base/cam.s, h = w*ASP;
    return {transform:`translate(${p.x - w/2}px, ${p.y - h/2}px) scale(${k})`, opacity:op, ...extra}; }
  function preparar(largura, grande){
    base = largura; const src = grande || largura > 150 ? 'assets/nave.webp' : 'assets/nave-192.webp';
    if (img.getAttribute('src') !== src) img.setAttribute('src', src);
    el.style.width = (base/cam.s)+'px'; el.style.height = (base*ASP/cam.s)+'px';
    return img.decode().catch(()=>{});
  }
  function direcao(dx, dy){
    cauda.style.setProperty('--ang', (Math.atan2(dy,dx)*180/Math.PI) + 'deg');
    img.style.transform = `rotate(${Math.max(-12, Math.min(12, dx/Math.hypot(dx,dy||1e-6)*10))}deg)`;
  }
  const vivo = ev => { if (ev !== evento) throw 'abortado'; };
  function pairar(k){                                            // flutuação ao ficar parada: amplitude pelo tamanho na tela
    const altura = base*ASP*k, amp = Math.max(2.5, Math.min(12, altura*.35));
    el.style.setProperty('--amp', (amp/k)+'px'); corpo.classList.add('flutua');
  }
  async function mover(ev, frames, dur, easing){ vivo(ev); const a = el.animate(frames, {duration:dur, easing, fill:'forwards'}); anims.push(a); await a.finished.catch(()=>{}); vivo(ev); }
  function rastro(on, dur, delay=0){ const a = cauda.animate([{opacity:getComputedStyle(cauda).opacity},{opacity:on?1:0}], {duration:dur, delay, fill:'forwards'}); anims.push(a); }
  function esperar(ev, seg){ vivo(ev); flutuaRest = seg; return new Promise(r=>{ fimFlutuar = r; }).then(()=>vivo(ev)); }

  function obstaculos(){
    const sel = ['.region.is-active .region__texto','.region.is-active .planeta','.region.is-active .logo','.region.is-active .hero-legenda','#painel .commands','#menuBtn','.hud','.topo-acoes','#kupim-badge-wrap'];
    return sel.flatMap(q=>[...document.querySelectorAll(q)]).map(e=>e.getBoundingClientRect()).filter(r=>r.width && r.height);
  }
  function pontoLivre(w){
    const h = w*ASP, m = 28, obs = obstaculos();
    for (let i=0;i<50;i++){
      const x = rnd(m + w, W - m - w), y = rnd(m + h + 50, H - m - h - 90);
      const bate = obs.some(r => x + w/2 + m > r.left && x - w/2 - m < r.right && y + h/2 + m > r.top && y - h/2 - m < r.bottom);
      if (!bate) return {x, y};
    }
    return null;
  }
  function discoRect(){
    const im = disco && disco.firstElementChild; if (!im || $('#logo').classList.contains('pre')) return null;
    const r = im.getBoundingClientRect(); if (!r.width) return null;
    return {x: r.left + r.width*(CROP.x + CROP.w/2), y: r.top + r.height*(CROP.y + CROP.h/2), w: r.width*CROP.w};
  }
  const longe = () => Math.hypot(W,H)*.85;
  function vetor(){ const a = (Math.floor(Math.random()*8)*45 + rnd(-10,10)) * Math.PI/180; return {dx:Math.cos(a), dy:Math.sin(a)}; }

  /* --- passagem rápida --- */
  async function passagem(ev){
    const w = tamanho(); await preparar(w, false); vivo(ev);
    const {dx, dy} = vetor(), P = {x: W*rnd(.2,.8), y: H*rnd(.2,.8)}, D = longe() + w*6;
    const doFundo = Math.random() < .2;                           // às vezes nasce lá no fundo, já dentro da tela
    const A = doFundo ? P : {x:P.x - dx*D, y:P.y - dy*D}, B = {x:P.x + dx*D, y:P.y + dy*D};
    const k0 = rnd(.6,1.2), k1 = rnd(.6,1.5), dur = rnd(400,900);
    direcao(dx, dy); rastro(true, doFundo ? dur*.35 : 80);
    await mover(ev, doFundo
      ? [kf(A.x,A.y,.05,0), kf(A.x+dx*D*.1, A.y+dy*D*.1, .35, 1, {offset:.18}), kf(B.x,B.y,k1)]
      : [kf(A.x,A.y,k0), kf(B.x,B.y,k1)], dur, doFundo ? 'cubic-bezier(.55,0,1,.45)' : 'linear');
  }

  /* --- saídas da visita --- */
  async function sair(ev, T, w){
    const tipo = Math.random(), {dx, dy} = vetor();
    if (tipo < .5) {                                              // dispara pela borda
      const B = {x:T.x + dx*(longe()+w*6), y:T.y + dy*(longe()+w*6)};
      direcao(dx, dy); rastro(true, 120);
      await mover(ev, [kf(T.x,T.y,1), kf(B.x,B.y,rnd(.7,1.4))], rnd(420,600), 'cubic-bezier(.55,0,1,.45)');
    } else if (tipo < .8) {                                       // afunda no espaço até sumir
      direcao(dx, dy); rastro(true, 200); rastro(false, 300, 300);
      await mover(ev, [kf(T.x,T.y,1), kf(T.x+dx*w*3, T.y+dy*w*3, .03, 0)], 700, 'cubic-bezier(.5,0,.9,.5)');
    } else {                                                      // vem em direção à tela e passa pela "câmera"
      await preparar(w, true); vivo(ev);
      const k = lado()*.7 / w;
      await mover(ev, [kf(T.x,T.y,1), kf(W/2 + (T.x-W/2)*.4, H/2 + (T.y-H/2)*.4, k*.7, 1, {offset:.82}), kf(W/2 + (T.x-W/2)*.3, H/2 + (T.y-H/2)*.3, k, 0)], 380, 'cubic-bezier(.6,0,1,.6)');
    }
  }

  /* --- visita: chega, flutua, sai --- */
  async function visita(ev){
    const w = tamanho(), T = pontoLivre(w); if (!T) return passagem(ev);
    await preparar(w, false); vivo(ev);
    let A, k0 = rnd(.7,1.3);
    if (Math.random() < .7) { const {dx, dy} = vetor(); A = {x:T.x - dx*longe(), y:T.y - dy*longe()}; direcao(dx, dy); rastro(true, 80); rastro(false, 260, 380); }
    else { A = T; k0 = .04; direcao(1, 0); }                      // surge do fundo
    await mover(ev, [kf(A.x,A.y,k0, A===T?0:1), kf(T.x,T.y,1)], rnd(520,700), 'cubic-bezier(.16,1,.3,1)');
    pairar(1);
    let P = T, resto = sortear();
    for (;;) {
      fuga = null; await esperar(ev, resto); corpo.classList.remove('flutua');
      if (!fuga) { await sair(ev, P, w); return; }                 // tempo acabou: sai normalmente
      const B = await fugir(ev, P, w, 1); if (!B) return;          // fugiu do mouse e foi embora
      P = B; resto = fuga.resto; pairar(1);                         // só desviou: volta a flutuar no novo ponto
    }
  }

  /* --- fuga: o mouse chegou perto da nave parada --- */
  const limita = (v, a, b) => Math.min(b, Math.max(a, v));
  async function fugir(ev, T, w, k){
    const modo = cfg.naveFoge==='aleatorio' ? ['dispara','afunda','desvia'][Math.floor(Math.random()*3)] : cfg.naveFoge;
    let dx = T.x - fuga.x + rnd(-.25,.25)*w, dy = T.y - fuga.y + rnd(-.25,.25)*w; const n = Math.hypot(dx, dy) || 1; dx /= n; dy /= n;
    direcao(dx, dy);
    if (modo==='desvia') {                                         // pula para perto, fugindo do cursor, e segue flutuando
      const h = w*ASP, m = 16, obs = obstaculos(), base0 = Math.atan2(dy, dx);
      const livre = P => !obs.some(r => P.x + w/2 + m > r.left && P.x - w/2 - m < r.right && P.y + h/2 + m > r.top && P.y - h/2 - m < r.bottom);
      let B = null;
      for (let i = 0; i < 24 && !B; i++) {                         // salto curto, para longe do cursor, num lugar livre
        const a = base0 + rnd(-1, 1) * Math.min(1.2, .3 + i*.05), d = w * rnd(6, 10);
        const C = {x: limita(T.x + Math.cos(a)*d, w*2, W - w*2), y: limita(T.y + Math.sin(a)*d, w*2 + 50, H - w*2 - 90)};
        if (livre(C)) B = C;
      }
      if (!B) B = pontoLivre(w) || {x: limita(T.x + dx*w*7, w*2, W - w*2), y: limita(T.y + dy*w*7, w*2 + 50, H - w*2 - 90)};
      direcao(B.x - T.x, B.y - T.y);
      rastro(true, 60); rastro(false, 240, 140);
      await mover(ev, [kf(T.x,T.y,k), kf(B.x,B.y,k)], 340, 'cubic-bezier(.16,1,.3,1)');
      return B;
    }
    if (modo==='afunda') {                                         // afunda no espaço até sumir
      rastro(true, 120); rastro(false, 220, 200);
      await mover(ev, [kf(T.x,T.y,k), kf(T.x + dx*w*3, T.y + dy*w*3, k*.03, 0)], 450, 'cubic-bezier(.5,0,.9,.5)');
      return null;
    }
    const D = longe() + w*6;                                       // dispara para longe, saindo da tela
    rastro(true, 70);
    await mover(ev, [kf(T.x,T.y,k), kf(T.x + dx*D, T.y + dy*D, k*1.2)], 300, 'cubic-bezier(.55,0,1,.45)');
    return null;
  }
  addEventListener('pointermove', e=>{                             // com mouse: foge quando o cursor chega perto
    if (e.pointerType !== 'mouse' || !fimFlutuar || !corpo.classList.contains('flutua')) return;
    const r = img.getBoundingClientRect(); if (!r.width) return;
    if (Math.hypot(e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2)) > cfg.naveFogeDist) return;
    espantar(e.clientX, e.clientY);
  }, {passive:true});
  function espantar(x, y){ fuga = {x, y, resto:Math.max(1, flutuaRest)}; corpo.classList.remove('flutua'); const f = fimFlutuar; fimFlutuar = null; f(); }
  /* No celular: um toque curto na nave ou perto dela (até 56px) também a faz fugir.
     Arrastar o dedo não conta (continua sendo o gesto de trocar de setor); toque em planeta ou botão também não. */
  let toque = null;
  addEventListener('pointerdown', e=>{ toque = e.pointerType==='mouse' ? null : {x:e.clientX, y:e.clientY, t:performance.now()}; }, {passive:true});
  addEventListener('pointerup', e=>{
    const t = toque; toque = null;
    if (!t || e.pointerType==='mouse' || !fimFlutuar || !corpo.classList.contains('flutua')) return;
    if (Math.hypot(e.clientX - t.x, e.clientY - t.y) > 12 || performance.now() - t.t > 600) return;
    if (e.target.closest && e.target.closest('a, button, input, select, textarea, .planeta')) return;
    const r = img.getBoundingClientRect(); if (!r.width) return;
    if (Math.hypot(e.clientX - (r.left + r.width/2), e.clientY - (r.top + r.height/2)) > 56) return;
    try { navigator.vibrate && navigator.vibrate(12); } catch(err){}       // resposta tátil curta (Android; o iPhone não permite)
    espantar(e.clientX, e.clientY);
  }, {passive:true});

  /* --- Hero: o disco sai da logo e depois volta para o lugar --- */
  async function eventoHero(ev){
    const r0 = discoRect(); if (!r0) return;
    await preparar(r0.w, true); vivo(ev);
    camada.classList.add('frente');
    const r = discoRect() || r0;
    el.animate([kf(r.x, r.y, 1)], {fill:'forwards', duration:0}); disco.classList.add('fora');   // troca invisível
    const w = tamanho(), kS = w / r.w, lift = {x:r.x, y:r.y - r.w*.12};
    await mover(ev, [kf(r.x,r.y,1), kf(lift.x,lift.y,1.04)], 260, 'cubic-bezier(.23,1,.32,1)');   // decola
    const visitar = Math.random() < cfg.naveVisita, T = visitar ? pontoLivre(w) : null;
    let volta;
    if (T) {
      direcao(T.x-lift.x, T.y-lift.y); rastro(true, 120, 260); rastro(false, 220, 520);
      await mover(ev, [kf(lift.x,lift.y,1.04), kf(T.x,T.y,kS)], 700, 'cubic-bezier(.45,0,.2,1)');
      pairar(kS);
      let P = T, resto = sortear(), saiu = false;
      for (;;) {
        fuga = null; await esperar(ev, resto); corpo.classList.remove('flutua');
        if (!fuga) break;
        const B = await fugir(ev, P, w, kS); if (!B) { saiu = true; break; }
        P = B; resto = fuga.resto; pairar(kS);
      }
      if (saiu) {                                                   // fugiu do mouse: some um pouco e volta para a logo por outro lado
        el.animate([{opacity:0}], {fill:'forwards', duration:0}); rastro(false, 1);
        await esperar(ev, rnd(.8,2.5));
        const v = vetor(); volta = {x:r.x - v.dx*longe(), y:r.y - v.dy*longe(), k:kS*1.2};
      } else volta = {x:P.x, y:P.y, k:kS};
    } else {
      const {dx, dy} = vetor(), B = {x:lift.x + dx*(longe()+w*6), y:lift.y + dy*(longe()+w*6)}, dur = rnd(650,900);
      direcao(dx, dy); rastro(true, 120, dur*.32);                  // a cauda só aparece depois que a nave já encolheu
      await mover(ev, [kf(lift.x,lift.y,1.04), kf(lift.x + dx*r.w*.6, lift.y + dy*r.w*.6, kS*2.2, 1, {offset:.3}), kf(B.x,B.y,kS)], dur, 'cubic-bezier(.5,0,.85,.5)');
      el.animate([{opacity:0}], {fill:'forwards', duration:0}); rastro(false, 1);
      await esperar(ev, rnd(.8,2.5));
      const v = vetor(); volta = {x:r.x - v.dx*longe(), y:r.y - v.dy*longe(), k:kS*1.2};
    }
    const d = discoRect() || r;                                   // volta para o lugar exato na logo
    direcao(d.x-volta.x, d.y-volta.y); rastro(true, 80); rastro(false, 200, 180);   // a cauda some antes de a nave crescer
    await mover(ev, [kf(volta.x,volta.y,volta.k), kf(d.x, d.y - d.w*.05, 1.03, 1, {offset:.82}), kf(d.x, d.y, 1)], 950, 'cubic-bezier(.16,1,.3,1)');
  }

  function limpar(suave){
    anims.forEach(a=>a.cancel()); anims = []; el.getAnimations().forEach(a=>a.cancel());
    corpo.classList.remove('flutua'); camada.classList.remove('frente');
    if (disco.classList.contains('fora')) { disco.classList.remove('fora'); if (suave) disco.animate([{opacity:0},{opacity:1}], {duration:220}); }
    if (fimFlutuar) { const f = fimFlutuar; fimFlutuar = null; f(); }
    evento = null; estado = 'espera'; fuga = null;
  }
  async function disparar(hero, modo){
    limpar(false);
    const ev = evento = {hero, setor:atual}; estado = 'ativo'; acum = 0; alvo = sortear();
    try {
      if (hero) { heroLiberado = true; await eventoHero(ev); }
      else if (modo==='visita' || (!modo && Math.random() < cfg.naveVisita)) await visita(ev);
      else await passagem(ev);
    } catch(e) { if (e !== 'abortado') console.warn(e); }
    if (evento === ev) limpar(false);
  }
  const intro = () => document.documentElement.classList.contains('has-intro');
  const podeAgora = () => !efeitosReduzidos() && !document.hidden && !paginaAberta && !intro() && !mapaAberto && !menuAberto && Math.abs(cam.s-1) < .02;

  setInterval(()=>{
    const now = performance.now(), dt = Math.min(1, (now - tAnt)/1000); tAnt = now;
    if (efeitosReduzidos()) { if (evento) limpar(true); return; }
    if (evento) {
      if (evento.setor !== atual) { if (evento.hero || !voo) limpar(true); return; }   // saiu do setor: some (no Hero, o disco volta à logo)
      if (fimFlutuar && podeAgora() && !voo) { flutuaRest -= dt; if (flutuaRest <= 0) { const f = fimFlutuar; fimFlutuar = null; f(); } }
      return;
    }
    if (!podeAgora() || voo) return;
    const hero = atual === 'inicio';
    if (hero) heroAcum += dt;
    acum += dt;
    if (acum < alvo) return;
    if (hero && (!montada || (!heroLiberado && heroAcum < cfg.naveHeroEspera*(rapido?.1:1)))) return;
    disparar(hero);
  }, 200);

  return {
    agora(modo){ if (efeitosReduzidos() || paginaAberta) return; const hero = atual==='inicio' && modo!=='passagem' && modo!=='visita'; disparar(hero && montada, modo); },
    estado: () => ({estado, acum:+acum.toFixed(1), alvo:+alvo.toFixed(1), heroAcum:+heroAcum.toFixed(1), heroLiberado, evento: evento && {...evento}}),
    sortear
  };
})();

  video.addEventListener('timeupdate', ()=>{ if (video.duration) prog.style.transform = `scaleX(${Math.min(1, video.currentTime/video.duration)})`;
    if (video.duration && video.currentTime >= video.duration-.12) finish(); });
  fontes[fontes.length-1].addEventListener('error', ()=>finish(true));
  video.addEventListener('error', ()=>finish(true));
  video.addEventListener('playing', ()=>{ comecou=true; clearTimeout(cao); });
  video.addEventListener('waiting', ()=>{ clearTimeout(cao); cao=setTimeout(()=>finish(true),2500); });
  setTimeout(()=>{ intro.classList.add('can-skip'); skip.tabIndex=0; }, 1200);
  skip.addEventListener('click', e=>{ e.stopPropagation(); finish(true); });
  /* Pular tocando/clicando em qualquer parte do vídeo (a partir do mesmo instante em que o botão aparece).
     No toque, arrastar o dedo não pula: só um toque curto. */
  let ini = null;
  intro.addEventListener('pointerdown', e=>{ ini = {x:e.clientX, y:e.clientY}; });
  intro.addEventListener('pointerup', e=>{
    if (!ini || !intro.classList.contains('can-skip')) { ini = null; return; }
    const mov = Math.hypot(e.clientX-ini.x, e.clientY-ini.y); ini = null;
    if (mov < 12 && !e.target.closest('.intro__skip')) finish(true);
  });
  addEventListener('keydown', e=>{
    if (acabou) return;
    if (e.key==='Escape' || ((e.key==='Enter' || e.key===' ') && intro.classList.contains('can-skip') && document.activeElement!==skip)) { e.preventDefault(); finish(true); }
  });
  function start(){ const p=video.play(); if (p&&p.catch) p.catch(()=>finish(true));
    cao=setTimeout(()=>{ if(!comecou) finish(true); },3000); limite=setTimeout(()=>finish(),15000); }
  if (document.hidden) document.addEventListener('visibilitychange', function f(){ if(!document.hidden){ document.removeEventListener('visibilitychange',f); start(); } });
  else start();
})();
</script>

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateShift);

  new MutationObserver(function(){ if (!document.body.classList.contains('no-inicio')) wrap.classList.remove('is-open'); }).observe(document.body, {attributes:true, attributeFilter:['class']});
